<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Upload Test</title>
    <style>
        body {
          font-family: Arial, sans-serif;
          text-align: center;
          padding: 50px;
        }
        input[type="file"] {
          margin: 20px 0;
        }
        img {
          max-width: 300px;
          margin-top: 20px;
        }
    </style>
</head>
<body>

<h2>📁 File Upload Test</h2>
<p>Select an image or any file below:</p>

<input type="file" id="fileInput" accept="*/*">
<br>
<button onclick="previewFile()">Preview Image</button>

<div id="preview"></div>

<script>
    function previewFile() {
      const fileInput = document.getElementById('fileInput');
      const preview = document.getElementById('preview');
      const file = fileInput.files[0];

      if (!file) {
        alert("Please select a file first.");
        return;
      }

      if (file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = function (e) {
          preview.innerHTML = `<img src="${e.target.result}" alt="Preview Image">`;
        };
        reader.readAsDataURL(file);
      } else {
        preview.innerHTML = `<p>Selected file: <strong>${file.name}</strong></p>`;
      }
    }
</script>

</body>
</html>
